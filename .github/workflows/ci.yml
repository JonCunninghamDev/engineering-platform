name: Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-platform:
    name: Validate engineering platform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate pull request route and test evidence
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/changed-files.txt"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"
          echo "Changed files:"
          cat "$changed_files"
          python scripts/validate-pr-policy.py --changed-files-file "$changed_files"

      - name: Validate repository layout
        run: python scripts/validate-platform-layout.py

      - name: Validate public compatibility contract
        run: python scripts/validate_compatibility.py

      - name: Validate consumer-agnostic platform boundary
        run: python scripts/validate_consumer_agnostic.py

      - name: Run full platform test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Validate shell syntax
        run: find scripts actions tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Validate JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('.').rglob('*.json'))
          for path in files:
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'validated {path}')
          if not files:
              print('no JSON files yet')
          PY

      - name: Validate YAML syntax
        run: |
          ruby -e 'require "yaml"; files = Dir.glob("**/*.{yml,yaml}", File::FNM_DOTMATCH).reject { |path| path.include?("/.git/") }; files.each { |path| YAML.parse_file(path); puts "validated #{path}" }; puts "no YAML files" if files.empty?'
