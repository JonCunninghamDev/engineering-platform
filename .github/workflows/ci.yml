name: Platform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-platform:
    name: Validate engineering platform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository layout
        run: python scripts/validate-platform-layout.py

      - name: Test platform validators
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Validate shell syntax
        run: find scripts actions tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Validate JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('.').rglob('*.json'))
          for path in files:
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'validated {path}')
          if not files:
              print('no JSON files yet')
          PY

      - name: Validate YAML syntax
        run: |
          ruby -e 'require "yaml"; files = Dir.glob("**/*.{yml,yaml}", File::FNM_DOTMATCH).reject { |path| path.include?("/.git/") }; files.each { |path| YAML.parse_file(path); puts "validated #{path}" }; puts "no YAML files" if files.empty?'
